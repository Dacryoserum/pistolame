[package]
name = "pistolame-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pistolame-core.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies]
# Features needed by the WASAPI backend (walking-skeleton plan, B5.1).
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Features needed by the CoreAudio backend (docs/plans/coreaudio.md §0, §3.1).
objc2-core-audio = { workspace = true, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }
objc2-audio-toolbox = { workspace = true, features = ["std", "AUComponent", "AudioComponent", "AudioOutputUnit", "AudioUnitProperties", "objc2-core-audio", "objc2-core-audio-types"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFString", "CFBase"] }

[dev-dependencies]
pistolame-core = { workspace = true, features = ["test-support"] }
