name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --all --check

  # The Linux install script, run for real against the latest published release.
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh
      - name: Install, check and uninstall in a throwaway home
        run: |
          export HOME="$(mktemp -d)"
          sh scripts/install.sh
          test -x "$HOME/.local/share/pistolame/Pistolame"
          test -L "$HOME/.local/bin/pistolame"
          test -f "$HOME/.local/share/applications/pistolame.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/pistolame.png"
          sh scripts/install.sh --uninstall
          test ! -e "$HOME/.local/share/pistolame"
          test ! -e "$HOME/.local/bin/pistolame"

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
