[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["prototypes"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dacryoserum/pistolame"
version = "0.4.0"

[workspace.dependencies]
pistolame-core    = { path = "crates/pistolame-core" }
pistolame-output  = { path = "crates/pistolame-output" }
pistolame-library = { path = "crates/pistolame-library" }
pistolame-analysis = { path = "crates/pistolame-analysis" }

symphonia         = { version = "0.6.1", default-features = false, features = ["flac"] }
rtrb              = "0.4.0"
md-5              = "0.11.0"
crossbeam-channel = "0.5.17"
thiserror         = "2.0.21"
anyhow            = "1.0.104"
# `raw-window-handle-06`: the native window handle, which Windows media controls need.
# `unstable-winit-030`: winit's file-drop events (Slint has no drop API of its own). Pinned
# with `=` above, so this unstable API cannot change under us.
slint             = { version = "=1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
slint-build       = "=1.18.1"
rfd               = "0.17.2"
# Media keys and the system "Now Playing" (SMTC, MPNowPlayingInfoCenter, MPRIS). MIT. `use_zbus`
# talks to D-Bus in pure Rust, so Linux needs no libdbus at build time.
souvlaki          = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6.2"
# Per-OS application folders (MIT OR Apache-2.0).
dirs              = "7.0.0"
# Embeds the app icon into the Windows executable (MIT).
winresource       = "0.1.31"
# Self-update: manifest, versions and signature checks (all MIT/Apache except ed25519-dalek,
# BSD-3-Clause; all GPL-3.0-compatible). Downloads go through the system's curl.
serde             = { version = "1.0.229", features = ["derive"] }
serde_json        = "1.0.151"
semver            = "1.0.28"
sha2              = "0.11.0"
base64            = "0.23.1"
ed25519-dalek     = "3.0.0"
# SQLite for the library (MIT; `bundled` builds the public-domain SQLite, no system library).
rusqlite          = { version = "0.40.2", features = ["bundled"] }
# Folder watching for the library (CC0-1.0): new or removed files show up without a restart.
notify            = "8.2.0"
# Authenticity analysis ported from Nyquist (crates/pistolame-analysis): FFT (MIT/Apache-2.0),
# EBU R128 loudness and true peak (MIT), data parallelism (MIT/Apache-2.0). All pure Rust.
rustfft           = "6.4.1"
ebur128           = "0.1.10"
rayon             = "1.10"
flacenc           = { version = "0.5.1", default-features = false }
windows           = "0.62.2"   # features listed per crate
# CoreAudio bindings (macOS). Zlib/Apache-2.0/MIT; same objc2 0.6 family Slint already pulls in.
objc2-core-audio       = { version = "0.3.2", default-features = false }
objc2-core-audio-types = { version = "0.3.2", default-features = false }
objc2-audio-toolbox    = { version = "0.3.2", default-features = false }
objc2-core-foundation  = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"            # overridden with #![allow(unsafe_code)] only in backend modules
missing_docs = "warn"           # -D warnings in CI turns this into an error
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"   # every unsafe block needs a // SAFETY: comment
unwrap_used = "deny"                  # AGENTS.md: no unwrap outside tests
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"                 # examples opt out locally
float_arithmetic = "allow"            # set to "deny" inside pcm/ and feeder/ via #![deny(...)]

[profile.release]
opt-level = 3
debug = "line-tables-only"   # usable backtraces from user crash reports
strip = "debuginfo"
lto = "thin"
